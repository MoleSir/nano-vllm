[package]
name = "nanovllm"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }
luma-kit = { path = "../luma/luma", features = ["cuda", "nn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokenizers = "0.22"
derive_builder = "0.20.2"
rand = "0.10.0"